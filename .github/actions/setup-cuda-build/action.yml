name: Set up the hosted CUDA build
description: Install the pinned compiler, SDK and matching UI for a hosted build job
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - shell: bash
      run: python -m pip install cmake==3.31.10 ninja==1.13.0
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      if: runner.os == 'Windows'
      with:
        arch: x64
    - name: Linux dependencies and compiler memory
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13 libssl-dev
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo fallocate -l 8G "$RUNNER_TEMP/cuda-build.swap"
        sudo chmod 600 "$RUNNER_TEMP/cuda-build.swap"
        sudo mkswap "$RUNNER_TEMP/cuda-build.swap"
        sudo swapon "$RUNNER_TEMP/cuda-build.swap"
        free -h
        df -h .
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/cuda
        key: cuda-redist-13.0.1-${{ runner.os }}-v2
    - shell: bash
      run: python .github/scripts/setup_cuda.py "$RUNNER_TEMP/cuda"
    - name: Verify native shard handoff before expensive compilation
      shell: bash
      run: python -m unittest discover -s .github/scripts/tests -p test_cuda_shards.py
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ui-dist
        path: tools/ui/dist
