name: Hosted sanitizers
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      thread:
        type: boolean
        description: Include ThreadSanitizer validation
        default: false
permissions:
  contents: read
jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ADDRESS, UNDEFINED]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-13 g++-13 libssl-dev
      - run: python .github/scripts/build.py --sanitizer "$SANITIZER"
        env:
          SANITIZER: ${{ matrix.sanitizer }}
      - name: Portable memory, streaming and vision lifecycle tests
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 300 -R '^(test-(kv-stream|memory-|context-memory|backend-memory|speculative|arg-parser|server-vision|mtmd-projector-storage|cuda-fattn))'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - run: python -m pip install -r tools/server/tests/requirements.txt ./gguf-py
      - name: Sanitized basic server API tests
        working-directory: tools/server/tests
        run: bash tests.sh unit/test_basic.py
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  thread:
    if: github.event_name == 'workflow_dispatch' && inputs.thread
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-13 g++-13 libssl-dev
      - run: python3 .github/scripts/build.py --sanitizer THREAD
      - run: ctest --test-dir build --output-on-failure --timeout 300 -R '^test-memory-'
