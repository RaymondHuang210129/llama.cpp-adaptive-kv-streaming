name: Python type check
on:
  workflow_call:
permissions:
  contents: read
jobs:
  typing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            tools/**/requirements*.txt
      - run: python -m pip install -r requirements/requirements-all.txt ty==0.0.84
      - run: ty check --exit-zero-on-warning --output-format=github
