name: Weekly CUDA compatibility builds
on:
  schedule:
    - cron: '17 3 * * 1'
      timezone: America/Chicago
    - cron: '17 3 * * 2'
      timezone: America/Chicago
    - cron: '17 3 * * 3'
      timezone: America/Chicago
    - cron: '17 3 * * 4'
      timezone: America/Chicago
    - cron: '17 3 * * 5'
      timezone: America/Chicago
    - cron: '17 3 * * 6'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      profile:
        description: Architecture profile; both Linux and Windows are built
        type: choice
        options: [rtx40, rtx30, rtx20, v100, p100, pascal]
        default: rtx40
      source_sha:
        description: Published V3 source SHA, or blank for latest successful push CI
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: cuda-compatibility
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      profile: ${{ steps.source.outputs.profile }}
      skip: ${{ steps.source.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: source
        name: Resolve a successful published V3 source once
        run: python3 .github/scripts/fork_ci.py resolve-compat --profile "$PROFILE" --source-sha "$SOURCE_SHA"
        env:
          PROFILE: ${{ inputs.profile || 'rtx40' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
  ui-build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/ui-build.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
  cuda-linux:
    needs: [resolve, ui-build, cuda-dependencies]
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/build-cuda-sharded.yml
    with:
      os: ubuntu-24.04
      variant: linux-x64-cuda
      fatal_warnings: 'ON'
      profile: ${{ needs.resolve.outputs.profile }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      workers: 2
  cuda-windows:
    needs: [resolve, ui-build, cuda-dependencies]
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/build-cuda-sharded.yml
    with:
      os: windows-2022
      variant: windows-x64-cuda
      fatal_warnings: 'OFF'
      profile: ${{ needs.resolve.outputs.profile }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      workers: 2
  cuda-dependencies:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/build-cuda-dependencies.yml
    with:
      profile: ${{ needs.resolve.outputs.profile }}
      source_sha: ${{ needs.resolve.outputs.sha }}
  publish:
    needs: [resolve, cuda-linux, cuda-windows]
    if: always() && !cancelled() && needs.resolve.outputs.skip != 'true' && needs.cuda-linux.result == 'success' && needs.cuda-windows.result == 'success'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      profile: ${{ needs.resolve.outputs.profile }}
      source_sha: ${{ needs.resolve.outputs.sha }}
