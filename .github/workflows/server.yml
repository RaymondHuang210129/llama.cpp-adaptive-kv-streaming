name: Hosted server API tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  api:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            variant: linux-x64-cpu
          - os: windows-2022
            variant: windows-x64-cpu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cpu-test-${{ matrix.variant }}
          path: packages
      - name: Extract the tested CPU package
        run: python .github/scripts/extract_package.py packages build/bin
      - run: python -m pip install -r tools/server/tests/requirements.txt ./gguf-py
      - name: Server API tests
        working-directory: tools/server/tests
        run: bash tests.sh
      - name: Backend sampling API tests
        working-directory: tools/server/tests
        run: bash tests.sh
        env:
          LLAMA_ARG_BACKEND_SAMPLING: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: server-failure-${{ matrix.variant }}
          path: tools/server/tests/tmp/
          retention-days: 3
