name: CI (msys)
permissions:
  contents: read
env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
jobs:
  windows-msys2:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
        - sys: UCRT64
          env: ucrt-x86_64
          compiler: gcc
          build: Release
        - sys: CLANG64
          env: clang-x86_64
          compiler: clang
          build: Release
    steps:
    - name: Clone
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup ${{ matrix.sys }}
      uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d
      with:
        update: true
        msystem: ${{matrix.sys}}
        install: mingw-w64-${{matrix.env}}-${{matrix.compiler}} mingw-w64-${{matrix.env}}-cmake mingw-w64-${{matrix.env}}-openblas
    - name: Build using CMake
      shell: msys2 {0}
      run: |
        cmake -B build
        cmake --build build --config ${{ matrix.build }} -j $(nproc)
    - name: Clean after building using CMake
      shell: msys2 {0}
      run: |
        rm -rf build
    - name: Build using CMake w/ OpenBLAS
      shell: msys2 {0}
      run: |
        cmake -B build -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS
        cmake --build build --config ${{ matrix.build }} -j $(nproc)
'on':
  workflow_dispatch: {}
