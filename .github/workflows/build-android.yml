name: CI (android)
permissions:
  contents: read
env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
jobs:
  default:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        lfs: false
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: 17
        distribution: zulu
    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      with:
        log-accepted-android-sdk-licenses: false
    - name: Build
      run: |
        cd examples/llama.android
        ./gradlew build --no-daemon
  ndk:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.3
    defaults:
      run:
        shell: bash
    permissions:
      actions: write
      contents: read
    steps:
    - name: Clone
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        lfs: false
    - name: Dependencies
      run: |
        apt-get update
        apt-get install -y build-essential
    - name: Build
      id: ndk_build
      run: |
        cmake -D ANDROID_ABI=arm64-v8a -D ANDROID_PLATFORM=android-31 -D CMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake -D GGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.5-a+fp16+i8mm -G Ninja -D LLAMA_OPENSSL=OFF -D GGML_OPENMP=OFF -B build
        cmake --build build
        cmake --install build --prefix pkg-adb/llama.cpp
    - name: Upload Android Build Artifact
      if: ${{ always() && steps.ndk_build.outcome == 'success' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: llama-cpp-android-arm64-cpu
        path: pkg-adb/llama.cpp
  arm64:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
    - name: Clone
      id: checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: 17
        distribution: temurin
    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      with:
        log-accepted-android-sdk-licenses: false
    - name: Install NDK
      run: |
        sdkmanager "ndk;${{ env.NDK_VERSION }}"
        echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
    - name: Build
      id: cmake_build
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DLLAMA_FATAL_WARNINGS=ON \
          -DGGML_BACKEND_DL=ON \
          -DGGML_NATIVE=OFF \
          -DGGML_CPU_ALL_VARIANTS=ON \
          -DGGML_OPENMP=OFF \
          -DLLAMA_BUILD_BORINGSSL=ON \
          -DGGML_RPC=ON
        time cmake --build build --config Release -j $(nproc)
'on':
  workflow_dispatch: {}
