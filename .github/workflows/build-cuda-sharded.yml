name: Hosted parallel CUDA compilation
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      variant:
        type: string
        required: true
      fatal_warnings:
        type: string
        default: 'ON'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-cuda-build
      - name: Configure complete CUDA coverage
        run: python .github/scripts/build.py --backend cuda --fatal-warnings "$FATAL_WARNINGS" --configure-only
        env:
          FATAL_WARNINGS: ${{ inputs.fatal_warnings }}
      - id: plan
        run: python .github/scripts/cuda_shards.py plan --variant "$VARIANT" --workers 8
        env:
          VARIANT: ${{ inputs.variant }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuda-plan-${{ inputs.variant }}
          path: .ci-cuda/plan.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  compile:
    needs: plan
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-cuda-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuda-plan-${{ inputs.variant }}
          path: .ci-cuda
      - run: python .github/scripts/build.py --backend cuda --fatal-warnings "$FATAL_WARNINGS" --configure-only
        env:
          FATAL_WARNINGS: ${{ inputs.fatal_warnings }}
      - name: Compile this shard serially
        run: python .github/scripts/cuda_shards.py build --shard "$SHARD" --output .ci-cuda/objects.zip
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cuda-objects-${{ inputs.variant }}-${{ matrix.shard }}
          path: .ci-cuda/objects.zip
          compression-level: 0
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  build:
    needs: [plan, compile]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-cuda-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cuda-plan-${{ inputs.variant }}
          path: .ci-cuda
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cuda-objects-${{ inputs.variant }}-*
          path: .ci-cuda/archives
      - run: python .github/scripts/build.py --backend cuda --fatal-warnings "$FATAL_WARNINGS" --configure-only
        env:
          FATAL_WARNINGS: ${{ inputs.fatal_warnings }}
      - name: Verify every object and compiler dependency
        run: python .github/scripts/cuda_shards.py assemble --output .ci-cuda/external
      - name: Build host code and link the complete backend
        run: python .github/scripts/cuda_shards.py finish
      - name: Package the linked CUDA backend
        run: python .github/scripts/fork_ci.py package --build build --output packages --variant "$VARIANT" --cuda-root "$CUDA_PATH"
        env:
          VARIANT: ${{ inputs.variant }}
      - name: Packaged executable startup
        run: python .github/scripts/smoke_package.py packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/adaptive-kv-stream-v2'
        with:
          name: package-${{ inputs.variant }}
          path: packages/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1
