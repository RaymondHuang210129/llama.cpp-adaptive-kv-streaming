name: Hosted CPU builds
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            variant: linux-x64-cpu
            shared: 'ON'
          - os: windows-2022
            variant: windows-x64-cpu
            shared: 'ON'
          - os: ubuntu-24.04
            variant: linux-static
            shared: 'OFF'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-13 g++-13 libssl-dev git-lfs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-dist
          path: tools/ui/dist
      - name: Build
        run: python .github/scripts/build.py --shared "$SHARED"
        env:
          SHARED: ${{ matrix.shared }}
      - run: python -m pip install ./gguf-py jinja2==3.1.6
      - name: Configure vocabulary fixture downloads
        if: runner.os == 'Linux'
        run: git lfs install --skip-repo
      - name: Portable CPU tests
        run: ctest --test-dir build -L main --output-on-failure --parallel 2 --timeout 900
        env:
          LLAMA_TEST_VOCABS_REVISION: 2c9db6cf7f8f6f80ec1c13e0cd5016c5a96de1c6
      - name: Prepare internal server-test binaries
        if: matrix.shared == 'ON'
        run: python .github/scripts/fork_ci.py package --build build --output packages --variant "$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
      - name: Packaged executable startup
        if: matrix.shared == 'ON'
        run: python .github/scripts/smoke_package.py packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.shared == 'ON'
        with:
          name: cpu-test-${{ matrix.variant }}
          path: packages/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1
