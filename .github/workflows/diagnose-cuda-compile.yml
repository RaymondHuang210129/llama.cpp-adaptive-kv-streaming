name: Diagnose one CUDA compilation
on:
  pull_request:
    branches: [feature/adaptive-kv-stream-v2]
    types: [labeled]
  workflow_dispatch:
    inputs:
      source:
        description: Heavy streaming translation unit
        type: choice
        options: [kv-stream-mma-runtime-1-8.cu, kv-stream-mma-runtime-4-2.cu]
        default: kv-stream-mma-runtime-4-2.cu
      architecture:
        description: One target to isolate, or all current release targets
        type: choice
        options: [75-virtual, 86-real, 89-real, '120', all]
        default: 75-virtual
      os:
        description: Runner comparison
        type: choice
        options: [both, windows-2022, ubuntu-24.04]
        default: both
permissions:
  contents: read
jobs:
  ui-build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'profile-cuda-compile'
    uses: ./.github/workflows/ui-build.yml
  profile:
    needs: ui-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os || 'both') == 'both' && '["ubuntu-24.04","windows-2022"]' || format('["{0}"]', inputs.os)) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-cuda-build
      - name: Configure the selected diagnostic target
        env:
          ARCHITECTURE: ${{ inputs.architecture || '75-virtual' }}
          FATAL_WARNINGS: ${{ matrix.os == 'windows-2022' && 'OFF' || 'ON' }}
        run: |
          if [ "$ARCHITECTURE" = all ]; then
            python .github/scripts/build.py --backend cuda --configure-only --fatal-warnings "$FATAL_WARNINGS"
          else
            python .github/scripts/build.py --backend cuda --configure-only --fatal-warnings "$FATAL_WARNINGS" --cuda-architectures "$ARCHITECTURE"
          fi
      - name: Profile one fresh object with unchanged optimization settings
        env:
          SOURCE: ${{ inputs.source || 'kv-stream-mma-runtime-4-2.cu' }}
        run: python .github/scripts/profile_cuda_compile.py --source "$SOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cuda-compile-diagnostic-${{ matrix.os }}-${{ inputs.source || 'kv-stream-mma-runtime-4-2.cu' }}-${{ inputs.architecture || '75-virtual' }}
          path: cuda-compile-diagnostics/
          if-no-files-found: warn
          retention-days: 3
