name: Shared CUDA build dependencies
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: rtx50
      source_sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - id: profile
        run: python .github/scripts/fork_ci.py profile --profile "$PROFILE"
        env:
          PROFILE: ${{ inputs.profile }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .ci-cccl
          key: cccl-source-${{ steps.profile.outputs.cccl }}-${{ hashFiles('.github/scripts/setup_cccl.py') }}
      - name: Prepare and verify the pinned source once
        run: python .github/scripts/setup_cccl.py --version "$CCCL_VERSION"
        env:
          CCCL_VERSION: ${{ steps.profile.outputs.cccl }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cccl-source-${{ inputs.profile }}-${{ inputs.source_sha || github.sha }}
          path: .ci-cccl
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
